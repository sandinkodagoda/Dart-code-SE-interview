name: NEXORA Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy NEXORA
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 25m
          script: |
            set -eu

            cd /opt/nexora

            echo "Fetching latest changes..."
            git fetch origin main
            git merge --ff-only origin/main

            echo "Building production containers..."
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              build

            echo "Applying database migrations..."
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              run --rm backend \
              npx prisma migrate deploy

            echo "Starting updated containers..."
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              up -d --no-build

            echo "Waiting for frontend..."
            frontend_ready=false

            for i in $(seq 1 30); do
              if curl --fail --silent \
                --max-time 5 \
                http://127.0.0.1:3100/ \
                -o /dev/null; then
                frontend_ready=true
                echo "Frontend is healthy!"
                break
              fi

              echo "Frontend not ready (attempt $i/30)"
              sleep 3
            done

            if [ "$frontend_ready" != "true" ]; then
              echo "Frontend health check failed!"
              docker logs --tail 50 nexora-frontend
              exit 1
            fi

            echo "Waiting for backend..."
            backend_ready=false

            for i in $(seq 1 30); do
              if curl --fail --silent \
                --max-time 5 \
                http://127.0.0.1:5100/api/v1/products \
                -o /dev/null; then
                backend_ready=true
                echo "Backend is healthy!"
                break
              fi

              echo "Backend not ready (attempt $i/30)"
              sleep 3
            done

            if [ "$backend_ready" != "true" ]; then
              echo "Backend health check failed!"
              docker logs --tail 50 nexora-backend
              exit 1
            fi

            echo "Checking public HTTPS website..."
            curl --fail --silent --show-error \
              https://nexoradummy.duckdns.org/ \
              -o /dev/null

            echo "Checking public HTTPS API..."
            curl --fail --silent --show-error \
              https://nexoradummy.duckdns.org/api/v1/products \
              -o /dev/null

            echo "NEXORA deployment successful!"
