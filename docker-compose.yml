version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: techgadgets_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: electronics_ecommerce
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d electronics_ecommerce']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techgadgets_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: api/v1
      APP_NAME: 'TechGadgets Store API'
      DATABASE_URL: 'postgresql://postgres:postgrespassword@postgres:5432/electronics_ecommerce?schema=public'
      JWT_SECRET: 'production-grade-super-secret-jwt-key-min-32-chars-long'
      JWT_EXPIRES_IN: '1d'
      FRONTEND_URL: 'http://localhost:3000'
      UPLOAD_DIR: './uploads'
      MAX_FILE_SIZE: 5242880
      PAYHERE_MERCHANT_ID: '1211111'
      PAYHERE_MERCHANT_SECRET: '4MzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzM'
      PAYHERE_CURRENCY: 'LKR'
      PAYHERE_BASE_URL: 'https://sandbox.payhere.lk/pay/checkout'
      WHATSAPP_BUSINESS_NUMBER: '94771234567'

volumes:
  postgres_data:
